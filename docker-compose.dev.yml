# ═══════════════════════════════════════════════════════════════════════
# Price-My-Car — Development override
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Adds: source bind mounts + hot reload. NEVER use in production.
# ═══════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      target: dev
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./helpers.py:/app/helpers.py
      - ./test_helpers.py:/app/test_helpers.py
      - ./Cleaned_Car_data.csv:/app/Cleaned_Car_data.csv
      - ./ml_ready:/app/ml_ready
      # Auth DB is created at runtime; the Makefile's `up` target touches
      # users_db.json first so this bind mount is a file, not a directory.
      - ./users_db.json:/app/users_db.json
    command: >
      streamlit run streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
      --server.fileWatcherType=polling
      --server.runOnSave=true
