name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
          cache: pip
        with:
          python-version: "3.12"

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 only: numpy>=2.5.1 and xgboost>=3.3.0 (dependabot) require
        # Python >=3.12, so testing 3.11 would fail the pipeline.
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check all Python files
        run: |
          python -c "
          import py_compile;
          py_compile.compile('app/helpers.py', doraise=True);
          py_compile.compile('app/streamlit_app.py', doraise=True);
          py_compile.compile('tests/test_helpers.py', doraise=True);
          print('All files compile OK')
          "

      - name: Run unit tests
        run: python -m pytest tests/test_helpers.py -v --tb=short -x

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken links in docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config /dev/null
            --no-progress
            --exclude 'https?://localhost'
            --exclude 'https?://127\.0\.0\.1'
            --exclude 'https?://.*shields\.io'
            --exclude 'https?://.*example\.com'
            --exclude 'https?://.*test\.org'
            --exclude 'https?://.*yourusername.*'
            --exclude 'https?://.*your-username.*'
            --exclude 'https?://.*static\.streamlit\.io'
            --exclude 'https?://.*\{.*\}.*'
            '**/*.md'
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build image
        run: docker build -t autointel:ci .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: autointel:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # pip vendors msgpack/setuptools under pip/_vendor/ (versions pinned in
          # pip/_vendor/vendor.txt). Trivy reports those vendored copies against
          # GHSA-6v7p-g79w-8964 (msgpack 1.1.2) and CVE-2025-47273 (setuptools
          # 70.3.0) even though the app's real runtime packages in site-packages
          # are patched (msgpack 1.2.1, setuptools 84.0.0). The app never imports
          # pip's vendored copies, so exclude that directory from the scan.
          skip-dirs: /usr/local/lib/python3.12/site-packages/pip/_vendor

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
          cache: pip
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      - name: Type check with mypy
        run: mypy . --ignore-missing-imports
