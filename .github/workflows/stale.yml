name: Stale Issues & PRs
on:
  schedule:
    - cron: '0 0 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          stale-issue-message: 'This issue has been automatically marked as stale. It will be closed in 14 days if no activity occurs.'
          stale-pr-message: 'This PR has been automatically marked as stale. It will be closed in 7 days if no activity occurs.'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 14
          days-before-pr-close: 7
          exempt-issue-labels: 'pinned,security,bug'
          exempt-pr-labels: 'pinned,security'
