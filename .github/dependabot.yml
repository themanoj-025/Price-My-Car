version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - python
  commit-message:
    prefix: deps
    include: scope
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  labels:
  - dependencies
  - pre-commit
  commit-message:
    prefix: chore(deps)
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: chore(deps)
    include: scope
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: Asia/Kolkata
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: chore(deps)
    include: scope
